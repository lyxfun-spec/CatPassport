<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小猫助手</title>
    <style>
      /* Startup screen must render from this inline style alone: the bundled CSS
         is not available on the first frame. Keep in sync with splash.html. */
      :root { --boot-muted: #657080; --boot-danger: #a94f49; --boot-accent: #466987; --boot-track: #e7ebef; }
      html, body, #root { width: 100%; height: 100%; }
      body { margin: 0; background: #fff; color: #252c36; font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif; }
      .boot { position: fixed; inset: 0; z-index: 10; display: grid; place-content: center; justify-items: center;
        background: radial-gradient(460px 300px at 50% 40%, #eef4f8 0%, rgba(238, 244, 248, 0) 72%), #fff;
        text-align: center; opacity: 1; transition: opacity 240ms cubic-bezier(.22, .75, .25, 1); }
      .boot.is-hidden { opacity: 0; pointer-events: none; }
      .boot-mark { width: 64px; height: 64px; object-fit: contain; filter: drop-shadow(0 10px 22px rgba(35, 51, 71, .16)); }
      .boot-title { margin: 18px 0 8px; font-size: 20px; font-weight: 600; letter-spacing: .04em; }
      .boot-status { margin: 0 0 20px; color: var(--boot-muted); font-size: 12.5px; letter-spacing: .02em; }
      .boot-status.danger { color: var(--boot-danger); }
      .boot-progress { position: relative; width: 132px; height: 3px; border-radius: 999px; background: var(--boot-track); overflow: hidden; }
      .boot-progress i { position: absolute; top: 0; bottom: 0; left: 0; width: 42%; border-radius: 999px;
        background: linear-gradient(90deg, rgba(70, 105, 135, 0) 0%, var(--boot-accent) 50%, rgba(70, 105, 135, 0) 100%);
        animation: boot-slide 1.5s cubic-bezier(.45, .05, .55, .95) infinite;
        /* Dev mode swaps documents after the on-disk splash; preload seeds this with the
           elapsed time so the bar continues its sweep instead of restarting. */
        animation-delay: calc(0s - var(--boot-offset, 0s)); }
      @keyframes boot-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        .boot { transition: none; }
        .boot-progress i { animation: none; }
        .boot-progress i { width: 100%; transform: none; background: var(--boot-accent); opacity: .35; }
      }
    </style>
  </head>
  <body>
    <div class="boot" id="boot" role="status" aria-live="polite">
      <img class="boot-mark" src="./src/assets/brand.png" alt=""/>
      <strong class="boot-title">小猫助手</strong>
      <p class="boot-status" id="boot-status"><span id="boot-text">正在启动</span></p>
      <span class="boot-progress" id="boot-progress" aria-hidden="true"><i></i></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/renderer.tsx"></script>
  </body>
</html>
