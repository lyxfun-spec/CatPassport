<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小猫助手</title>
    <style>
      html, body, #root { width: 100%; height: 100%; }
      body { margin: 0; background: #fff; color: #334454; font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif; }
      .boot-shell { height: 100%; display: grid; place-content: center; justify-items: center; gap: 12px; }
      .boot-mark { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 15px; color: #526e83; background: #edf3f6; font-size: 25px; }
      .boot-shell strong { font-size: 18px; font-weight: 600; }
      .boot-shell span { color: #7c8791; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-shell"><div class="boot-mark" aria-hidden="true">◇</div><strong>小猫助手</strong><span>正在准备…</span></div></div>
    <script type="module" src="/src/renderer.tsx"></script>
  </body>
</html>
